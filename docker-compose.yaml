services:
  opencode-web:
    image: opencode-web:ubuntu-latest
    container_name: opencode-web
    build:
      context: .
      dockerfile: dockerfiles/ubuntu-latest.dockerfile
    environment:
      LANG: C.UTF-8
      TERM: xterm-256color
      HOST: 0.0.0.0
      PORT: 4096
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data:/home/user
      - ./workspace:/workspace
